<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能OnCall助手</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar" role="navigation" aria-label="主导航">
            <div class="sidebar-header">
                <h2 class="sidebar-title">智能OnCall助手</h2>
            </div>
            <div class="sidebar-nav" role="tablist" aria-label="页面导航">
                <button class="nav-tab active" data-page="chat" id="navTabChat" role="tab" aria-selected="true">对话</button>
                <button class="nav-tab" data-page="knowledge" id="navTabKnowledge" role="tab" aria-selected="false">知识库</button>
                <button class="nav-tab" data-page="skills" id="navTabSkills" role="tab" aria-selected="false">技能</button>
                <button class="nav-tab" data-page="settings" id="navTabSettings" role="tab" aria-selected="false">设置</button>
            </div>
            <div class="sidebar-content" id="sidebarChatContent">
                <button class="new-chat-btn" id="newChatBtn" aria-label="新建对话">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span>新建对话</span>
                </button>
                <div class="chat-history-section">
                    <div class="history-header"><span>近期对话</span></div>
                    <div class="chat-history-list" id="chatHistoryList"></div>
                </div>
            </div>
        </aside>

        <main class="main-content" role="main">
            <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>AI Ops</span>
            </button>

            <!-- 对话页面 -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-greeting" id="welcomeGreeting"><p>你好！我是智能Oncall小助手</p></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="问问智能OnCall助手" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <svg class="tools-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/></svg>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <svg viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                            <span>上传文件</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">快速</span>
                                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item active" data-mode="quick"><div class="dropdown-item-main"><span>快速</span></div><div class="dropdown-item-sub">快速对话</div></div>
                                            <div class="dropdown-item" data-mode="stream"><div class="dropdown-item-main"><span>流式</span></div><div class="dropdown-item-sub">流式对话</div></div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown,.doc,.docx,.pdf,.png,.jpg,.jpeg,.bmp,.gif" style="display:none;">
                </div>
            </div>

            <!-- 知识库管理页面 -->
            <div class="knowledge-container" id="knowledgeContainer" style="display:none;">
                <div class="knowledge-header">
                    <h2>知识库管理</h2>
                    <button class="knowledge-upload-btn" id="knowledgeUploadBtn">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>上传文件</span>
                    </button>
                </div>
                <div class="knowledge-drop-zone" id="knowledgeDropZone">
                    <svg viewBox="0 0 24 24" fill="none" width="48" height="48"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <p>拖拽文件到此处上传</p>
                    <span>支持 TXT, MD, PDF, DOCX, PNG, JPG 格式，最大 50MB</span>
                </div>
                <div class="knowledge-url-section">
                    <div class="knowledge-url-row">
                        <input type="url" id="knowledgeUrlInput" placeholder="输入网页URL，如 https://example.com" class="knowledge-url-input">
                        <input type="text" id="knowledgeUrlTitle" placeholder="自定义名称（可选）" class="knowledge-url-title-input">
                        <button id="knowledgeUrlSubmit" class="knowledge-url-submit-btn">抓取并索引</button>
                    </div>
                </div>
                <div class="knowledge-stats-bar" id="knowledgeStatsBar">
                    <span>共 <strong id="knowledgeTotalCount">0</strong> 个文件</span>
                    <span>已索引 <strong id="knowledgeIndexableCount">0</strong> 个</span>
                    <span>总大小 <strong id="knowledgeTotalSize">0 B</strong></span>
                </div>
                <div class="knowledge-toolbar">
                    <div class="knowledge-search">
                        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <input type="text" id="knowledgeSearchInput" placeholder="搜索文件...">
                    </div>
                    <button class="secondary-action-btn" id="refreshKnowledgeBtn">
                        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        刷新
                    </button>
                </div>
                <div class="knowledge-file-list" id="knowledgeFilesList">
                    <div class="knowledge-file-list-header">
                        <span class="kf-col-name">文件名</span><span class="kf-col-type">类型</span><span class="kf-col-size">大小</span><span class="kf-col-time">上传时间</span><span class="kf-col-action">操作</span>
                    </div>
                </div>
            </div>

            <!-- 技能管理页面 -->
            <div class="skills-container" id="skillsContainer" style="display:none;">
                <div class="skills-header">
                    <h2>技能管理</h2>
                    <div class="skills-header-actions">
                        <div class="skills-search-bar">
                            <input type="text" id="skillSearchInput" placeholder="搜索技能..." class="skill-search-input">
                            <button class="skill-search-btn" id="skillSearchBtn">
                                <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            </button>
                        </div>
                        <select id="skillCategoryFilter" class="skill-category-filter">
                            <option value="">全部分类</option>
                            <option value="troubleshooting">故障排查</option>
                            <option value="monitoring">监控</option>
                            <option value="deployment">部署</option>
                            <option value="networking">网络</option>
                            <option value="security">安全</option>
                            <option value="database">数据库</option>
                            <option value="general">通用</option>
                        </select>
                        <button class="skill-github-search-btn" id="skillGithubSearchBtn">
                            <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span>自动搜索</span>
                        </button>
                        <button class="skill-create-btn" id="skillCreateBtn">
                            <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <span>手动创建</span>
                        </button>
                    </div>
                </div>
                <div class="skills-grid" id="skillsGrid"></div>

                <!-- GitHub 搜索结果弹窗 -->
                <div class="github-search-modal" id="githubSearchModal" style="display:none;">
                    <div class="github-search-content">
                        <div class="github-search-header"><h3>从 GitHub 搜索 MCP Server</h3><button class="github-search-close" id="githubSearchClose">&times;</button></div>
                        <div class="github-search-input-row"><input type="text" id="githubSearchInput" placeholder="输入关键词..."><button id="githubSearchSubmit">搜索</button></div>
                        <div class="github-search-results" id="githubSearchResults"></div>
                    </div>
                </div>

                <!-- 手动创建技能弹窗 -->
                <div class="skill-create-modal" id="skillCreateModal" style="display:none;">
                    <div class="skill-create-content">
                        <div class="skill-create-header"><h3>创建技能</h3><button class="skill-create-close" id="skillCreateClose">&times;</button></div>
                        <div class="skill-create-form">
                            <label>名称 <span class="required">*</span></label><input type="text" id="skillFormName" placeholder="技能名称">
                            <label>描述</label><textarea id="skillFormDescription" placeholder="技能描述" rows="3"></textarea>
                            <label>分类</label><select id="skillFormCategory"><option value="general">通用</option><option value="troubleshooting">故障排查</option><option value="monitoring">监控</option><option value="deployment">部署</option><option value="networking">网络</option><option value="security">安全</option><option value="database">数据库</option></select>
                            <label>提示模板</label><textarea id="skillFormPromptTemplate" placeholder="可复用的提示模板，可用 {problem} 作为占位符" rows="4"></textarea>
                            <label>工具链描述</label><textarea id="skillFormToolChain" placeholder="描述使用的工具和步骤" rows="3"></textarea>
                            <label>标签（逗号分隔）</label><input type="text" id="skillFormTags" placeholder="标签1, 标签2">
                            <button class="skill-form-submit" id="skillFormSubmit">创建</button>
                        </div>
                    </div>
                </div>

                <!-- 技能详情弹窗 -->
                <div class="skill-detail-modal" id="skillDetailModal" style="display:none;">
                    <div class="skill-detail-content">
                        <div class="skill-detail-header"><h3 id="skillDetailName">技能名称</h3><button class="skill-detail-close" id="skillDetailClose">&times;</button></div>
                        <div class="skill-detail-body" id="skillDetailBody"></div>
                    </div>
                </div>
            </div>

            <!-- 设置页面 -->
            <div class="settings-container" id="settingsContainer" style="display:none;">
                <div class="settings-header">
                    <h2>设置</h2>
                </div>
                <div class="settings-section">
                    <h3 class="settings-section-title">外观</h3>
                    <div class="settings-item">
                        <div class="settings-item-info">
                            <span class="settings-item-label">暗黑模式</span>
                            <span class="settings-item-desc">切换深色/浅色主题外观</span>
                        </div>
                        <label class="theme-toggle">
                            <input type="checkbox" id="themeToggleCheckbox">
                            <span class="theme-toggle-slider">
                                <span class="theme-toggle-icon theme-toggle-sun">
                                    <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                </span>
                                <span class="theme-toggle-icon theme-toggle-moon">
                                    <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content"><div class="loading-spinner"></div><div class="loading-text">智能运维分析中，请稍候...</div><div class="loading-subtext">后端正在处理，请耐心等待</div></div>
    </div>

    <div class="confirm-modal" id="confirmModal" style="display:none;">
        <div class="confirm-modal-content"><p class="confirm-modal-message" id="confirmModalMessage"></p>
        <div class="confirm-modal-actions"><button class="confirm-modal-btn confirm-modal-cancel" id="confirmModalCancel">取消</button><button class="confirm-modal-btn confirm-modal-ok" id="confirmModalOK">确定</button></div></div>
    </div>

    <input type="file" id="knowledgeFileInput" accept=".txt,.md,.markdown,.doc,.docx,.pdf,.png,.jpg,.jpeg,.bmp,.gif" style="display:none;">
    <script src="app.js"></script>
</body>
</html>
